<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Déclic Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Plan : le monde du dossard de course et du timecode de tournage.
   Grand condensé athlétique, numéro de dossard épinglé, timecodes en mono.
   Le bleu cobalt guide, le rouge REC ne sert qu'au temps de la vidéo. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --sunk:#E2E6EE; --ink:#101828; --muted:#535E78; --line:#D0D6E2;
  --accent:#2036E8; --accent-ink:#FFFFFF; --accent-soft:#E2E6FF; --signal:#D92D14;
  --ok:#0B7A4C; --warn:#9A5600; --warn-soft:#FFF0D6; --ok-soft:#DCF5E9;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1221; --surface:#151D31; --sunk:#0F1729; --ink:#EEF1F8; --muted:#A3AEC7; --line:#2B3650;
  --accent:#8C9DFF; --accent-ink:#0C1221; --accent-soft:#232E58; --signal:#FF6B4E;
  --ok:#4DD29B; --warn:#F4B453; --warn-soft:#3A2C12; --ok-soft:#10352A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1221; --surface:#151D31; --sunk:#0F1729; --ink:#EEF1F8; --muted:#A3AEC7; --line:#2B3650;
  --accent:#8C9DFF; --accent-ink:#0C1221; --accent-soft:#232E58; --signal:#FF6B4E;
  --ok:#4DD29B; --warn:#F4B453; --warn-soft:#3A2C12; --ok-soft:#10352A; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-text-size-adjust:100%}
body{min-height:100%;padding-bottom:84px}
h1,h2,h3,p{margin:0}
h1,h2{font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:.005em;line-height:.95;text-wrap:balance}
h1{font-size:clamp(46px,9vw,88px);font-style:normal}
h2{font-size:clamp(30px,5vw,40px)}
h3{font-size:18px;font-weight:700;line-height:1.25;text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:14px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--ink)}
.topbar .wrap{display:flex;align-items:center;gap:20px;min-height:60px}
.logo{font:900 28px/1 var(--display);text-transform:uppercase;letter-spacing:.01em;background:none;border:0;padding:0;cursor:pointer}
.logo span{color:var(--accent)}
.nav{display:flex;gap:2px;margin-left:auto}
.nav button{background:none;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:15px;color:var(--muted)}
.nav button:hover{color:var(--ink);background:var(--sunk)}
.nav button[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
.status{font:400 12px/1 var(--mono);color:var(--muted);white-space:nowrap}
main.wrap{padding:32px 20px 40px}
.stack{display:flex;flex-direction:column;gap:18px}
.stack-lg{display:flex;flex-direction:column;gap:36px}
.head{display:flex;flex-direction:column;gap:8px;max-width:680px;align-items:flex-start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:6px;border:2px solid var(--ink);background:transparent;font-weight:700;cursor:pointer;line-height:1.2;min-height:44px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.small{padding:6px 11px;min-height:34px;font-size:14px;border-width:1.5px}
.btn.quiet{border-color:var(--line);font-weight:600}
.btn[disabled]{opacity:.55;cursor:wait}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tag{display:inline-block;font:500 12px/1 var(--mono);padding:5px 7px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.ex{background:var(--warn-soft);color:var(--warn)}
.tag.a{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600}
input[type=text],input[type=number],input[type=search],textarea,select{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;font-weight:400}
textarea{resize:vertical;min-height:88px;line-height:1.5}
input:focus,textarea:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notice{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 6px 6px 0;font-size:15px}
.notice.warn{border-color:var(--warn);background:var(--warn-soft)}
.loading{display:flex;gap:12px;align-items:center;padding:16px;border:1.5px dashed var(--line);border-radius:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--signal);flex:none;animation:rec 1.2s infinite}
@keyframes rec{50%{opacity:.25}}

/* Accueil */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:center}
.hero .lead{font-size:18px;max-width:52ch}
.bib{background:#FFFFFF;color:#101828;border:2px solid #101828;border-radius:8px;position:relative;transform:rotate(1.6deg);overflow:hidden;box-shadow:6px 6px 0 var(--accent)}
.bib-top{background:#2036E8;color:#fff;font:700 13px/1 var(--mono);padding:13px 24px;display:flex;justify-content:space-between;gap:8px}
.bib-num{font:900 112px/.9 var(--display);text-align:center;padding:16px 16px 4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bib-name{font:800 20px/1.1 var(--display);text-transform:uppercase;text-align:center;padding:0 22px 18px;overflow-wrap:anywhere}
.pin{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--bg);border:1.5px solid #101828}
.pin.a{top:8px;left:8px}.pin.b{top:8px;right:8px}.pin.c{bottom:8px;left:8px}.pin.d{bottom:8px;right:8px}
.rail{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:0;counter-reset:s}
.rail li{border-top:5px solid var(--line);padding:9px 8px 0 0;font-size:14px;font-weight:600;color:var(--muted)}
.rail li.done{border-color:var(--ok);color:var(--ink)}
.rail li.now{border-color:var(--accent);color:var(--accent)}
.rail .n{display:block;font:500 12px/1.3 var(--mono)}
.next{background:var(--ink);color:var(--bg);border-radius:10px;padding:24px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.next h2{font-size:32px}
.next p{max-width:56ch;margin-top:6px;opacity:.86}
.next .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat b{font:900 38px/1 var(--display);display:block;font-variant-numeric:tabular-nums}

/* Script */
.script{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.side{position:sticky;top:78px;display:flex;flex-direction:column;gap:14px}
.sec{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px}
.tc{font:500 13px/1.2 var(--mono);color:var(--signal);padding-top:30px;font-variant-numeric:tabular-nums}
.tc::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--signal);margin-right:5px;vertical-align:1px}
.sec-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.sec-title{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;font-weight:700}
.sec textarea{font-size:17px;min-height:96px}
.dir{font-size:14px;color:var(--muted);font-style:italic}
.tools{display:flex;flex-wrap:wrap;gap:4px}
.tools button{background:none;border:0;padding:4px 7px;border-radius:4px;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer}
.tools button:hover{background:var(--accent-soft)}
.hookopt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;cursor:pointer;background:var(--surface)}
.hookopt.on{border-color:var(--accent)}
.hookopt input{margin-top:5px;accent-color:var(--accent)}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.check li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;font-size:14px;line-height:1.35;align-items:start}
.pill{font:500 11px/1 var(--mono);padding:4px 0;text-align:center;border-radius:4px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.bigtime{font:900 54px/1 var(--display);font-variant-numeric:tabular-nums}

/* Prompteur */
.prompter{position:fixed;inset:0;z-index:60;background:#05070D;color:#F5F7FB;display:flex;flex-direction:column}
.p-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:#0F1524}
.p-bar button{background:#22304F;color:#fff;border:0;padding:9px 13px;border-radius:6px;font-weight:700;cursor:pointer;min-height:40px}
.p-bar .go{background:#2036E8}
.p-bar label{font-size:14px;display:flex;align-items:center;gap:6px}
.p-text{flex:1;overflow-y:auto;padding:38vh 8vw 60vh;font-weight:600;line-height:1.35}
.p-text p{margin:0 0 1em;max-width:30ch;margin-inline:auto}
.p-text mark{background:#FFD24A;color:#101828;padding:0 4px;border-radius:3px}
.p-line{position:absolute;left:0;right:0;top:40%;border-top:2px solid rgba(255,107,78,.55);pointer-events:none}

/* Profil guidé */
.wizard{max-width:640px;display:flex;flex-direction:column;gap:16px}
.progress{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.pillar{border-top:4px solid var(--accent);padding-top:8px}

.tabs{display:none}
@media (max-width:860px){
  .hero,.script{grid-template-columns:1fr}
  .bib{width:210px;margin:0 auto;order:2}
  .bib-num{font-size:72px;padding-top:10px}
  .bib-name{font-size:16px;padding-bottom:14px}
  .hero .lead{display:none}
  .hero{gap:20px}
  .side{position:static}
  .nav{display:none}
  .status{margin-left:auto}
  .tabs{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:2px solid var(--ink)}
  .tabs button{background:none;border:0;padding:12px 0 13px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;min-height:54px}
  .tabs button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
}
@media (max-width:560px){
  .rail{grid-template-columns:repeat(3,1fr);row-gap:12px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat b{font-size:30px}
  .sec{grid-template-columns:1fr;gap:2px}
  .tc{padding-top:0}
}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>

<script>
"use strict";
/* ---------- Données fixes ---------- */
const VIEWS=[["today","Aujourd’hui"],["idees","Idées"],["script","Script"],["accroches","Accroches"],["videos","Vidéos"],["profil","Profil"]];
const THEMES=["Discipline","Progression","Sport","Défis","Réussite","Mindset"];
const WPS=2.6; // français parlé face caméra : environ 155 mots par minute
const SECTIONS=[
 ["accroche","Accroche","Arrêter le pouce"],
 ["tension","Tension","Nommer ce qui coince"],
 ["preuve","Ton vécu","La preuve, c’est toi"],
 ["declic","Déclic","L’idée qui change l’angle"],
 ["action","Action","Un geste faisable aujourd’hui"],
 ["fin","Fin","Donner envie d’envoyer ou de revoir"]];
const FIELDS=[
 {k:"name",q:"Comment tu t’appelles à l’image ?",why:"Ton nom apparaît sur ton dossard et dans tes scripts.",type:"text",ph:"Ton prénom ou ton pseudo",req:1},
 {k:"gender",q:"Quand tu parles de toi, tu dis plutôt…",why:"Tes scripts sont à la première personne : les accords doivent être justes.",type:"chips",opts:["« je suis motivée » (féminin)","« je suis motivé » (masculin)"]},
 {k:"story",q:"D’où tu pars ?",why:"Ton histoire est ce que personne ne peut copier. C’est la matière de tes meilleures vidéos.",type:"area",ph:"Ce que tu as traversé, tes échecs, le moment où quelque chose a changé…",req:1},
 {k:"now",q:"Où tu en es aujourd’hui ?",why:"Tes routines et ton sport nourrissent le concret de chaque script.",type:"area",ph:"Ta routine, ton sport, ce que tu travailles, ce qui reste dur…"},
 {k:"challenge",q:"Quel défi tu suis en ce moment ?",why:"Un défi en cours donne une série et une raison de revenir voir la suite.",type:"challenge"},
 {k:"audience",q:"À qui tu parles ?",why:"On écrit mieux pour une seule personne que pour tout le monde.",type:"area",ph:"Son âge, sa vie, ce qu’elle veut devenir…",req:1},
 {k:"blocks",q:"Qu’est-ce qui bloque vraiment cette personne ?",why:"Les accroches qui marchent nomment un blocage précis.",type:"area",ph:"Elle commence tout et ne finit rien, elle se compare…"},
 {k:"belief",q:"Quelle idée tu défends, même si elle déplaît ?",why:"Une opinion claire fait réagir et donne envie d’envoyer la vidéo.",type:"area",ph:"Ex. : la motivation est surestimée"},
 {k:"goal",q:"Que veux-tu que ton compte t’apporte dans 90 jours ?",why:"Les concepts seront choisis en fonction de ce but.",type:"chips",opts:["Plus de portée","Une communauté fidèle","Vendre une offre","Des partenariats"]},
 {k:"voice",q:"Comment tu parles ?",why:"Colle une phrase ou un extrait de tes vidéos. Les scripts reprendront ta façon de dire les choses.",type:"area",ph:"Tes expressions, ta manière de t’adresser aux gens, un script que tu aimes…"},
 {k:"wins",q:"Quelle vidéo a le mieux marché, et pourquoi selon toi ?",why:"On repart de ce qui a déjà fonctionné chez toi.",type:"area",ph:"Le sujet, l’accroche, ce que les gens ont commenté…"},
 {k:"rhythm",q:"Combien de vidéos par semaine tiens-tu vraiment ?",why:"Un rythme tenu vaut mieux qu’un rythme rêvé. Ton guide s’y adapte.",type:"num",ph:"3"}
];
const HOOKS=[
 ["Vérité","Personne ne veut l’entendre, mais [sujet] ne dépend pas de ta motivation."],
 ["Vérité","Si tu n’arrives pas à [objectif], ce n’est pas un problème de volonté."],
 ["Vérité","Ce n’est pas de la paresse. Tu fuis quelque chose de précis."],
 ["Vérité","Ton problème n’a jamais été le temps."],
 ["Vérité","Tu sais déjà quoi faire. C’est pour ça que tu tournes en rond."],

 ["Vérité","Le jour où tu auras envie n’arrivera pas."],

 ["Défi","Ce que je n’ai pas montré du jour [X]."],
 ["Contre-pied","Arrête de te lever à 5 h."],
 ["Contre-pied","Ne fixe plus d’objectifs."],
 ["Contre-pied","La pire chose à faire quand tu perds ta motivation, c’est d’en chercher."],
 ["Contre-pied","Tout le monde te dit de sortir de ta routine. Fais l’inverse."],
 ["Contre-pied","Le repos m’a plus fait progresser que [effort]."],
 ["Contre-pied","Les gens disciplinés ne sont pas ceux que tu crois."],
 ["Contre-pied","Aller plus vite t’éloigne de ton objectif."],
 ["Test","Si tu fais ça le matin, ta journée est déjà perdue."],

 ["Test","Si cette phrase te vise, c’est que tu es au bon endroit."],

 ["Méthode","Voici comment je me remets au sport après une pause."],
 ["Méthode","La chose que je fais tous les soirs pour ne pas lâcher."]
];
const CLICHES=["zone de confort","mindset de gagnant","meilleure version de toi","crois en tes rêves","rien n’est impossible","tout est possible","le succès","game changer","sors de ta zone","n'attends plus","transforme ta vie","passe au niveau supérieur"];
const RULES=`Tu écris pour un créateur francophone de vidéos courtes face caméra (Instagram Reels et TikTok), niche développement personnel : discipline, progression, sport, défis, réussite, mindset.
TON : comme un ami proche. Posé et réfléchi, direct, puis une montée d'énergie motivante vers la fin. Une personne parle à une personne : tutoiement.
STYLE : français parlé naturel. Phrases courtes, faciles à dire d'un souffle. Du concret, des gestes, des images. Pas de vocabulaire de coach, aucun anglicisme inutile, pas d'expressions comme "zone de confort", "meilleure version de toi", "mindset de gagnant". Pas de "Salut", pas d'annonce de ce que la vidéo va dire.
HONNÊTETÉ : n'invente jamais un fait sur le créateur, un souvenir, un chiffre, une étude ou une citation. Utilise seulement ce que dit le profil. Si un détail personnel manque, écris un repère entre crochets à remplir, par exemple [ton exemple : le jour où tu as voulu arrêter]. L'accroche doit être tenue par la vidéo : pas de promesse trompeuse.
SÉCURITÉ : aucun défi dangereux, aucun jeûne ou régime extrême, aucun entraînement malgré une blessure, aucune promesse de gains, de guérison ou de résultat garanti. Si le sujet touche à une vraie détresse, invite avec douceur à en parler à un proche ou à un professionnel.
PORTÉE : les signaux qui comptent le plus sont le temps de visionnage, la complétion et les envois à un proche. Chaque idée doit donc donner une raison de rester jusqu'à la fin et une raison précise de l'envoyer à quelqu'un.`;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const words=t=>(String(t||"").replace(/\[[^\]]*\]/g,m=>m.split(/\s+/).slice(0,4).join(" ")).trim().match(/[^\s]+/g)||[]).length;
const secs=t=>words(t)/WPS;
const fmt=s=>{s=Math.round(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const holes=t=>(String(t||"").match(/\[[^\]]+\]/g)||[]);
const cur=()=>S.videos.find(v=>v.id===S.currentId)||null;
const profileReady=()=>{const p=S.profile;return !!(p.name&&p.story&&p.audience)};
const femme=()=>/féminin/.test(S.profile.gender||"");

function setStatus(t){const e=$("#status");if(e)e.textContent=t}
function touch(v){S.updatedAt=Date.now();dirtyMain=true;if(v){v.updatedAt=Date.now();dirtyVideos.add(v.id)}schedule()}
function schedule(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  clearTimeout(timer);timer=setTimeout(flush,900);
}
function mainDoc(){const {videos,...rest}=S;return rest}
async function flush(){
  if(!db||!uid){setStatus(cloud?"":"Sur cet appareil");return}
  if(writing){clearTimeout(timer);timer=setTimeout(flush,700);return}
  writing=true;setStatus("Enregistrement…");
  try{
    const col=db.collection("data/users/"+uid);
    if(dirtyMain){dirtyMain=false;await col.doc("main").set(mainDoc())}
    for(const vid of [...dirtyVideos]){
      dirtyVideos.delete(vid);
      const v=S.videos.find(x=>x.id===vid);
      if(v)await col.doc("v-"+vid).set(v);else await col.doc("v-"+vid).delete();
    }
    setStatus("Enregistré");
  }catch(e){setStatus("Sur cet appareil")}
  writing=false;
}
async function connect(){
  if(!window.claude||!claude.use){return}
  try{
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u)return;
    const uidV=await u.id();if(!uidV)return;
    db=d;uid=uidV;cloud=true;
    const snap=await db.collection("data/users/"+uid).get();
    let remote=null;const vids=[];
    snap.docs.forEach(x=>{const b=x.data();if(!b)return;if(x.id==="main")remote=b;else if(x.id.startsWith("v-"))vids.push(b)});
    const byId=new Map(S.videos.map(v=>[v.id,v]));
    vids.forEach(v=>{const l=byId.get(v.id);if(!l||(v.updatedAt||0)>=(l.updatedAt||0))byId.set(v.id,JSON.parse(JSON.stringify(v)))});
    if(remote&&(remote.updatedAt||0)>=(S.updatedAt||0)){const c=JSON.parse(JSON.stringify(remote));S=Object.assign(blank(),S,c)}
    else if(S.updatedAt)dirtyMain=true;
    S.videos=[...byId.values()].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    S.videos.forEach(v=>{if(!vids.some(r=>r.id===v.id))dirtyVideos.add(v.id)});
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    setStatus("Enregistré");render();
    if(dirtyMain||dirtyVideos.size)flush();
  }catch(e){setStatus("Sur cet appareil")}
}
async function getAI(){
  if(ai!==undefined)return ai;
  if(!window.claude||!claude.use){ai=null;return ai}
  try{ai=await claude.use("sample")}catch(e){ai=null}
  return ai;
}
async function ask(prompt,tier){
  const s=await getAI();
  if(!s)throw {code:"no_ai"};
  return await s.json(prompt+"\n\nRéponds uniquement avec le JSON demandé, sans texte autour.",{modelTier:tier||"default",cache:false});
}
function aiError(e){
  if(e&&e.code==="no_ai")return null;
  if(e&&e.code==="not_granted"){ai=null;return null}
  if(e&&e.code==="rate_limited")return "Trop de demandes d’un coup. Attends une minute puis réessaie.";
  return "La génération n’a pas abouti. Réessaie, ton travail est conservé.";
}

/* ---------- Contexte envoyé à l’IA ---------- */
function ctx(){
  const p=S.profile,c=p.challenge||{},out=[];
  const add=(l,v)=>{if(v)out.push(l+" : "+v)};
  add("Prénom",p.name);add("Accords à la première personne",p.gender);
  add("Son histoire",p.story);add("Aujourd'hui",p.now);
  if(c.name)add("Défi en cours",c.name+(c.day?" (jour "+c.day+(c.total?" sur "+c.total:"")+")":""));
  add("Audience",p.audience);add("Blocages de l'audience",p.blocks);add("Idée défendue",p.belief);
  add("Objectif à 90 jours",p.goal);add("Sa façon de parler",p.voice);add("Ce qui a déjà marché",p.wins);
  add("Thèmes",(p.themes||[]).join(", "));
  if(S.strategy){add("Positionnement",S.strategy.positioning);add("Piliers",S.strategy.pillars.map(x=>x.name).join(", "));if(S.strategy.series)add("Série",S.strategy.series.name)}
  const les=S.videos.filter(v=>v.lesson).slice(0,8).map(v=>"- "+v.idea.title+" : "+v.lesson);
  if(les.length)out.push("Leçons de ses vidéos publiées :\n"+les.join("\n"));
  return out.join("\n");
}

/* ---------- Générations ---------- */
async function run(label,fn){
  ui.busy=label;ui.error=null;render();
  try{await fn()}catch(e){ui.error=aiError(e)||ui.error;console.warn(e)}
  ui.busy=null;render();
}
function genStrategy(){return run("J’analyse ton profil pour trouver ta ligne…",async()=>{
  let r;
  try{
    r=await ask(`${RULES}\n\nPROFIL\n${ctx()}\n\nDéfinis sa ligne éditoriale. Reste au plus près de ce qui est unique chez lui ou elle.\nJSON : {"positioning":"une phrase, qui il ou elle est pour son audience","promise":"ce que l'audience gagne à le ou la suivre","pillars":[{"name":"3 à 5 mots","why":"une phrase","example":"un exemple de vidéo"}],"series":{"name":"nom court d'une série récurrente","concept":"une phrase"},"avoid":["3 choses à éviter"]}\nDonne exactement 4 piliers.`,"default");
    if(!r||!Array.isArray(r.pillars))throw {code:"bad"};
    r.source="ia";
  }catch(e){if(aiError(e)&&e.code!=="bad")throw e;r=localStrategy()}
  S.strategy=r;touch();
})}
function genIdeas(){return run("Je cherche des concepts à partir de ton vécu…",async()=>{
  let list;
  try{
    const avoid=[...S.rejected.slice(-20),...S.videos.slice(0,20).map(v=>v.idea.title),...S.ideas.map(i=>i.title)];
    const r=await ask(`${RULES}\n\nPROFIL\n${ctx()}\n\n${ui.spark?"CE QUI S'EST PASSÉ CETTE SEMAINE : "+ui.spark+"\nAu moins deux concepts doivent partir de ce moment.\n":""}${ui.pillar?"PILIER À PRIVILÉGIER : "+ui.pillar+"\n":""}${avoid.length?"DÉJÀ VU, NE PAS RÉPÉTER : "+avoid.join(" ; ")+"\n":""}
Propose 6 concepts de vidéos face caméra, très différents les uns des autres. Chacun doit s'appuyer sur un élément réel du profil. Si un défi est en cours, l'un d'eux est un épisode de ce défi. Évite les sujets vus partout : prends un angle que seule cette personne peut raconter.
JSON : {"ideas":[{"title":"titre court","angle":"l'angle en une phrase","hook":"accroche parlée, 12 mots maximum","pillar":"pilier","stay":"pourquoi on reste jusqu'à la fin","sendTo":"à qui précisément on l'envoie","ingredient":"l'élément du profil utilisé"}]}`,"default");
    if(!r||!Array.isArray(r.ideas)||!r.ideas.length)throw {code:"bad"};

function genScript(idea,duration){
  const d=duration||S.profile.duration||45;
  return run("J’écris ton script…",async()=>{
    let r;
    try{
      const total=Math.round(d*WPS);
      const o=await ask(`${RULES}\n\nPROFIL\n${ctx()}\n\nCONCEPT\nTitre : ${idea.title}\nAngle : ${idea.angle||""}\nAccroche proposée : ${idea.hook||""}\nOn reste parce que : ${idea.stay||""}\nOn l'envoie à : ${idea.sendTo||""}\n
Écris le script parlé de cette vidéo face caméra de ${d} secondes, soit environ ${total} mots au total (rythme de 155 mots par minute). Respecte ce total.
Sections : accroche (12 mots maximum, 3 secondes), tension (nomme le blocage), preuve (le vécu du créateur), declic (l'idée qui change l'angle), action (un geste faisable aujourd'hui), fin (une dernière phrase qui donne envie d'envoyer la vidéo ou se reconnecte à l'accroche pour que la boucle marche).
Ouvre une question dans l'accroche et ne la referme qu'après la preuve, pour garder l'attention.
JSON : {"hooks":["3 accroches parlées différentes, 12 mots maximum"],"screenText":"texte à l'écran pendant l'accroche, 6 mots maximum","sections":[{"key":"accroche|tension|preuve|declic|action|fin","text":"texte exact à dire","direction":"indication de jeu très courte"}],"tips":["2 conseils de tournage précis pour cette vidéo"]}`,"complex");
      if(!o||!Array.isArray(o.sections)||o.sections.length<4)throw {code:"bad"};
      r={duration:d,hooks:(o.hooks||[]).slice(0,3),hookIndex:0,screenText:o.screenText||"",tips:o.tips||[],source:"ia",
        sections:SECTIONS.map(s=>{const f=o.sections.find(x=>x.key===s[0])||{};return {key:s[0],label:s[1],goal:s[2],text:f.text||"",direction:f.direction||""}})};
      if(r.hooks[0])r.sections[0].text=r.sections[0].text||r.hooks[0];
      if(!r.hooks.length)r.hooks=[r.sections[0].text];
    }catch(e){if(aiError(e)&&e.code!=="bad")throw e;r=localScript(idea,d)}
    let v=S.videos.find(x=>x.ideaId===idea.id);
    if(v)Object.assign(v,r);else{v=Object.assign({id:id(),ideaId:idea.id,idea:idea,status:"script",createdAt:Date.now(),metrics:{}},r);S.videos.unshift(v)}
    v.status="script";S.currentId=v.id;touch(v);go("script");
  });
}
async function rewrite(v,i,how){

    if(r&&r.text){s.text=r.text;touch(v)}
  }catch(e){ui.error=aiError(e)||"Cette retouche demande l’IA, indisponible ici. Modifie le texte directement."}

async function adaptHook(i){
  const h=HOOKS[i];
  ui.busy="J’adapte cette accroche à ton profil…";ui.error=null;render();
  try{
    const c=cur();
    const r=await ask(`${RULES}\n\nPROFIL\n${ctx()}\n\n${c?"VIDÉO EN COURS : "+c.idea.title+"\n":""}Modèle d'accroche : ${h[1]}\nÉcris 3 accroches parlées inspirées de ce modèle, propres à cette personne, 12 mots maximum. Remplis les crochets avec du réel issu du profil ; s'il manque l'info, garde un repère entre crochets.\nJSON : {"hooks":["...","...","..."]}`,"quick");
    if(r&&r.hooks)ui.adapted[i]=r.hooks;
  }catch(e){const m=aiError(e);if(m)ui.error=m;else ui.adapted[i]=[fillHook(h[1])]}
  ui.busy=null;render();
}
function fillHook(t){
  const p=S.profile,c=p.challenge||{};
  let o=t.replace(/\[X\]/g,c.day||"[X]").replace(/\[habitude\]/g,c.name||"[habitude]");
  if(femme())o=o.replace("Je me suis lancé","Je me suis lancée").replace("pas sûr de","pas sûre de");
  return o;
}
async function analyse(v){
  const m=v.metrics||{},pct=m.watch&&v.duration?Math.round(m.watch/v.duration*100):null;
  ui.busy="Je cherche ce que cette vidéo t’apprend…";ui.error=null;render();
  try{
    const r=await ask(`${RULES}\n\nPROFIL\n${ctx()}\n\nVIDÉO PUBLIÉE : ${v.idea.title}\nAccroche : ${v.sections[0].text}\nDurée : ${v.duration} s\nVues : ${m.views||"?"}\nTemps moyen regardé : ${m.watch||"?"} s${pct?" ("+pct+" %)":""}\nPartages : ${m.shares||"?"}\nEnregistrements : ${m.saves||"?"}\nRessenti : ${m.note||"aucun"}\nMoyennes de ses autres vidéos : ${JSON.stringify(averages(v))}\n\nDonne une leçon utile en une phrase, basée seulement sur ces chiffres, sans sur-interpréter une seule vidéo, et le prochain test à faire.\nJSON : {"lesson":"...","nextTest":"..."}`,"default");
    if(r&&r.lesson){v.lesson=r.lesson;v.nextTest=r.nextTest||""}
  }catch(e){const m2=aiError(e);if(m2)ui.error=m2}
  if(!v.lesson)v.lesson=localLesson(v);
  v.status="bilan";if(S.currentId===v.id)S.currentId=null;touch(v);ui.busy=null;render();
}
function averages(ex){
  const l=S.videos.filter(v=>v!==ex&&v.metrics&&+v.metrics.views>0);
  if(!l.length)return {};
  const a=f=>l.reduce((s,v)=>s+(f(v)||0),0)/l.length;
  return {vues:Math.round(a(v=>+v.metrics.views)),partagesPour1000:+a(v=>1000*(+v.metrics.shares||0)/+v.metrics.views).toFixed(1)};
}
function localLesson(v){
  const m=v.metrics||{},pct=m.watch&&v.duration?m.watch/v.duration:0;
  if(pct&&pct<.4)return "Les gens partent tôt : retravaille surtout l’accroche et la tension sur la prochaine vidéo.";
  if(m.views&&(+m.shares||0)/+m.views<.002)return "On regarde, mais on envoie peu : vise une personne plus précise dans la prochaine vidéo.";
  return "Bonne base : refais ce format avec un autre exemple tiré de ton vécu.";
}

/* ---------- Contrôle avant tournage ---------- */
function checks(v){
  const all=v.sections.map(s=>s.text).join(" "),hook=v.sections[0].text,t=secs(all),out=[];
  const gap=Math.abs(t-v.duration)/v.duration;
  out.push([gap<=.15,`Durée : ${fmt(t)} pour ${fmt(v.duration)} visé`,t>v.duration?"Raccourcis un passage.":"Tu peux ajouter un détail concret."]);
  out.push([words(hook)<=12&&words(hook)>0,`Accroche : ${words(hook)} mots`,"Vise 12 mots maximum."]);
  out.push([!/^\s*(salut|bonjour|hello|coucou|aujourd.hui je|dans cette vidéo)/i.test(hook),"Entrée directe dans le sujet","Enlève le bonjour ou l’annonce du sujet."]);
  const long=Math.max(0,...all.split(/[.!?…]+/).map(words));
  out.push([long<=18,`Phrase la plus longue : ${long} mots`,"Coupe-la pour la dire d’un souffle."]);
  const low=all.toLowerCase().replace(/'/g,"’"),cl=CLICHES.filter(c=>low.includes(c.replace(/'/g,"’")));
  out.push([!cl.length,cl.length?`Formule usée : « ${cl[0]} »`:"Aucune formule usée","Remplace-la par un exemple vécu."]);
  const h=v.sections.reduce((n,s)=>n+holes(s.text).length,0);
  out.push([h===0,h?`${h} repère${h>1?"s":""} à remplir avec ton vécu`:"Tous les repères sont remplis","Remplace les crochets par du réel."]);
  return out;
}

/* ---------- Guide ---------- */
function guide(){
  const c=cur();
  if(!profileReady())return {i:0,t:"Dis-moi qui tu es",b:"Quelques questions, une à la fois. Tout ce que l’appli te propose ensuite part de tes réponses.",l:"Répondre aux questions",a:"wizard"};
  if(!S.strategy)return {i:1,t:"Trouvons ta ligne",b:"Je transforme ton profil en positionnement, quatre piliers de contenu et une série récurrente.",l:"Définir ma ligne",a:"strategy"};
  if(!c)return {i:2,t:S.ideas.length?"Choisis ton concept":"Trouvons ta prochaine vidéo",b:S.ideas.length?"Tes concepts sont prêts. Prends celui que tu as le plus envie de raconter.":"Six concepts à partir de ton vécu et de ta semaine.",l:S.ideas.length?"Voir mes concepts":"Trouver des concepts",a:"idees"};
  const h=v=>v.sections.reduce((n,s)=>n+holes(s.text).length,0);
  if(c.status==="script"){
    if(h(c))return {i:3,t:"Mets ton vécu dans le script",b:`Il reste ${h(c)} repère${h(c)>1?"s":""} à remplir. Seul ton vrai vécu peut rendre ce script crédible.`,l:"Compléter le script",a:"script"};
    return {i:4,t:"Prêt à tourner",b:"Ton script est complet. Lance le prompteur et fais trois prises de l’accroche.",l:"Ouvrir le script",a:"script"};
  }
  return {i:5,t:c.status==="tourne"?"Publie, puis reviens":"Fais ton bilan",b:c.status==="tourne"?"Une fois en ligne, attends 48 heures avant de noter tes chiffres.":"Note tes chiffres. Chaque bilan rend tes prochains concepts plus justes.",l:c.status==="tourne"?"Marquer comme publiée":"Faire le bilan",a:c.status==="tourne"?"publish":"bilan"};
}
function weekCount(){
  const d=new Date(),day=(d.getDay()+6)%7,start=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day).getTime();
  return S.videos.filter(v=>v.publishedAt&&v.publishedAt>=start).length;
}

/* ---------- Rendu ---------- */
function go(v){ui.view=v;ui.error=null;try{if(location.hash!=="#"+v)location.hash=v}catch(e){}render();window.scrollTo(0,0)}
function busyHTML(){return ui.busy?`<div class="loading" aria-live="polite"><span class="dot"></span><span>${esc(ui.busy)}</span></div>`:""}
function errHTML(){return ui.error?`<div class="notice warn" role="alert">${esc(ui.error)}</div>`:""}
function modelNote(o){return o&&o.source==="modele"?`<div class="notice">L’écriture par IA n’est pas disponible ici. Voici un modèle à compléter. Ouvre l’appli depuis Claude et accepte la demande d’accès pour obtenir un texte écrit pour toi.</div>`:""}
function render(){
  const navH=VIEWS.map(([k,l])=>`<button data-go="${k}" ${ui.view===k?'aria-current="page"':""}>${l}</button>`).join("");
  $("#nav").innerHTML=navH;
  $("#tabs").innerHTML=VIEWS.map(([k,l])=>`<button data-go="${k}" ${ui.view===k?'aria-current="page"':""}>${l.replace("Aujourd’hui","Guide")}</button>`).join("");

/* ---------- Prompteur ---------- */
let pState=null;
function openPrompter(v){
  const paras=v.sections.map(s=>`<p>${esc(s.text).replace(/\[[^\]]+\]/g,m=>`<mark>${m}</mark>`)}</p>`).join("");
  $("#overlay").innerHTML=`<div class="prompter" role="dialog" aria-label="Prompteur"><div class="p-bar">
   <button class="go" id="p-play">Lancer</button><button id="p-reset">Revenir au début</button>
   <label for="p-speed">Vitesse <input type="range" id="p-speed" min="110" max="200" value="155"><span class="mono" id="p-wpm">155 mots/min</span></label>
   <label for="p-size">Taille <input type="range" id="p-size" min="26" max="72" value="${innerWidth<600?36:52}"></label>
   <button id="p-close" style="margin-left:auto">Fermer</button></div>
   <div style="position:relative;flex:1;display:flex;min-height:0"><div class="p-text" id="p-text" style="font-size:${innerWidth<600?36:52}px">${paras}</div><div class="p-line"></div></div></div>`;
  const box=$("#p-text"),total=words(v.sections.map(s=>s.text).join(" "));
  pState={playing:false,last:0,wpm:155,acc:0};
  const tick=t=>{
    if(!pState||!pState.playing)return;
    const dt=(t-pState.last)/1000;pState.last=t;
    const dist=Math.max(1,box.scrollHeight-innerHeight*.98),rate=dist/(total/(pState.wpm/60));
    pState.acc=Math.min(pState.acc+rate*dt,box.scrollHeight);box.scrollTop=pState.acc;
    if(box.scrollTop+box.clientHeight>=box.scrollHeight-2){pState.playing=false;$("#p-play").textContent="Lancer";return}
    requestAnimationFrame(tick);
  };
  $("#p-play").onclick=()=>{pState.playing=!pState.playing;$("#p-play").textContent=pState.playing?"Pause":"Lancer";if(pState.playing){pState.acc=box.scrollTop;pState.last=performance.now();requestAnimationFrame(tick)}};
  $("#p-reset").onclick=()=>{box.scrollTop=0;pState.acc=0};
  $("#p-speed").oninput=e=>{pState.wpm=+e.target.value;$("#p-wpm").textContent=pState.wpm+" mots/min"};
  $("#p-size").oninput=e=>{box.style.fontSize=e.target.value+"px"};
  $("#p-close").onclick=closePrompter;
  $("#p-play").focus();
}
function closePrompter(){pState=null;$("#overlay").innerHTML=""}

/* ---------- Événements ---------- */
function startWizard(){ui.wizard=S.profile.name?Math.max(0,FIELDS.findIndex(f=>!S.profile[f.k])):0;if(ui.wizard<0)ui.wizard=0;ui.wizError=null;go("profil")}
function refreshScriptLive(v){
  let t=0;v.sections.forEach((s,i)=>{const e=document.querySelector(`[data-tc="${i}"]`);if(e)e.textContent=fmt(t);t+=secs(s.text)});
  const b=$("#bigtime");if(b)b.textContent=fmt(t);
  const c=$("#checkcard");if(c){const l=checks(v),ok=l.every(x=>x[0]);c.innerHTML=`<h3>Contrôle avant tournage</h3>${checkHTML(l)}<p class="small muted">${ok?"Tout est bon. Ce contrôle ne prédit pas les vues : il retire ce qui fait partir les gens.":"À corriger avant de tourner."}</p>`}
}
document.addEventListener("input",e=>{
  const t=e.target,d=t.dataset;
  if(d.model){ui[d.model]=t.value;if(d.model==="hookQ")render();return}
  if(d.profile){S.profile[d.profile]=d.profile==="rhythm"?(+t.value||""):t.value;touch();return}
  if(d.ch){S.profile.challenge=S.profile.challenge||{};S.profile.challenge[d.ch]=t.value;touch();return}
  const v=S.videos.find(x=>x.id===ui.openVideo)||cur();
  if(d.secText!==undefined&&v){v.sections[+d.secText].text=t.value;touch(v);refreshScriptLive(v);return}
  if(d.vfield&&v){v[d.vfield]=t.value;touch(v);return}
  if(d.metric){const x=S.videos.find(y=>y.id===d.id);if(x){x.metrics=x.metrics||{};x.metrics[d.metric]=t.value;touch(x)}}
});
document.addEventListener("change",e=>{
  const h=e.target.dataset.hook;
  if(h!==undefined){const v=S.videos.find(x=>x.id===ui.openVideo)||cur();if(v){v.hookIndex=+h;v.sections[0].text=v.hooks[+h];touch(v);render()}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&pState)closePrompter()});
document.addEventListener("click",async e=>{
  const g=e.target.closest("[data-go]");
  if(g){if(g.dataset.go==="script")ui.openVideo=null;go(g.dataset.go);return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const d=b.dataset,a=d.act,vid=d.id,v=S.videos.find(x=>x.id===vid),cv=S.videos.find(x=>x.id===ui.openVideo)||cur(),idea=S.ideas.find(x=>x.id===vid);
  const acts={
   guide(){({wizard:startWizard,strategy:genStrategy,idees(){go("idees")},script(){ui.openVideo=null;go("script")},publish(){const c=cur();if(c){c.status="publie";c.publishedAt=Date.now();touch(c);go("videos")}},bilan(){go("videos")}})[d.a]()},
   wizard:startWizard, strategy:genStrategy, ideas:genIdeas,
   pillar(){ui.pillar=d.v;render()},
   "save-idea"(){if(idea){idea.saved=!idea.saved;touch();render()}},
   reject(){if(idea){S.rejected.push(idea.title);S.ideas=S.ideas.filter(x=>x!==idea);touch();render()}},
   write(){if(idea)genScript(idea)},
   "own-subject"(){const t=(ui.subject||"").trim();if(!t){ui.error="Écris ton sujet en quelques mots.";render();return}ui.subject="";genScript({id:id(),title:t,angle:"",hook:"",stay:"",sendTo:"quelqu’un que ce sujet touche"})},
   duration(){if(cv){cv.duration=+d.d;touch(cv);render()}},
   regen(){if(cv)genScript(cv.idea,cv.duration)},
   rewrite(){if(cv)rewrite(cv,+d.i,d.how)},
   prompter(){if(cv)openPrompter(cv)},
   async copy(){if(!cv)return;const txt=cv.sections.map(s=>s.text).join("\n\n");try{await navigator.clipboard.writeText(txt);b.textContent="Script copié"}catch(x){b.textContent="Copie refusée : sélectionne le texte"}setTimeout(()=>{b.textContent="Copier le script"},1800)},
   filmed(){if(v){v.status="tourne";touch(v);render()}},
   published(){if(v){v.status="publie";v.publishedAt=Date.now();touch(v);go("videos")}},
   open(){ui.openVideo=vid;go("script")},
   del(){if(ui.confirmDel!==vid){ui.confirmDel=vid;render();return}S.videos=S.videos.filter(x=>x.id!==vid);if(S.currentId===vid)S.currentId=null;ui.confirmDel=null;dirtyVideos.add(vid);touch();render()},
   analyse(){if(v)analyse(v)},
   hookcat(){ui.hookCat=d.v;render()},
   fav(){const i=+d.i,f=S.hookFavs;const p=f.indexOf(i);if(p<0)f.push(i);else f.splice(p,1);touch();render()},
   adapt(){adaptHook(+d.i)},
   "use-hook"(){const c=cur();if(c){c.sections[0].text=d.t;c.hooks=[d.t,...(c.hooks||[]).filter(x=>x!==d.t)].slice(0,3);c.hookIndex=0;touch(c);ui.openVideo=null;go("script")}},
   theme(){const t=S.profile.themes=S.profile.themes||[];const p=t.indexOf(d.v);if(p<0)t.push(d.v);else t.splice(p,1);touch();render()},
   pchip(){S.profile[d.k]=S.profile[d.k]===d.v?"":d.v;touch();render()},
   pdur(){S.profile.duration=+d.d;touch();render()},
   wback(){if(ui.wizard>0){ui.wizard--;ui.wizError=null;render()}},
   wnext(){
     if(d.need&&!String(S.profile[d.k]||"").trim()){ui.wizError="Cette réponse me sert pour tout le reste. Quelques mots suffisent.";render();return}
     ui.wizError=null;
     if(ui.wizard<FIELDS.length-1){ui.wizard++;render();window.scrollTo(0,0)}else{ui.wizard=null;go("today")}
   }
  };
  if(acts[a])await acts[a]();
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h)&&h!==ui.view){ui.view=h;render()}});
(function(){const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h))ui.view=h})();
render();
setStatus("Sur cet appareil");
connect();
</script>
